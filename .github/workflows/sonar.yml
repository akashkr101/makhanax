name: SonarQube

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Git Bash to PATH
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $gitBashPath = 'C:\Program Files\Git\bin'
          if (-not (Test-Path (Join-Path $gitBashPath 'bash.exe'))) {
            throw "Git Bash was not found at $gitBashPath. Install Git for Windows on the runner."
          }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$gitBashPath`n")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: npm ci

      - name: Run tests with coverage
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: npm run test:coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.qualitygate.wait=true