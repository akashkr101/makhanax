name: SonarQube

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Git Bash to PATH
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $gitBashPath = 'C:\Program Files\Git\bin'
          if (-not (Test-Path (Join-Path $gitBashPath 'bash.exe'))) {
            throw "Git Bash was not found at $gitBashPath. Install Git for Windows on the runner."
          }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$gitBashPath`n")

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: npm ci

      - name: Run tests with coverage
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: npm run test:coverage

      - name: SonarQube scan
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scannerVersion = '7.2.0.5079'
          $archiveName = "sonar-scanner-cli-$scannerVersion-windows-x64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "sonar-scanner-$scannerVersion"
          $downloadUrl = "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/$archiveName"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -UseBasicParsing
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $scannerPath = Join-Path $extractPath "sonar-scanner-$scannerVersion-windows-x64\bin\sonar-scanner.bat"
          if (-not (Test-Path $scannerPath)) {
            throw 'SonarScanner executable was not found after extraction.'
          }
          & $scannerPath '-Dsonar.qualitygate.wait=true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }