name: Build CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build development application
        if: github.ref_name == 'dev' || github.event_name == 'pull_request'
        run: npm run build:dev

      - name: Build test application
        if: github.ref_name == 'test'
        run: npm run build:test

      - name: Build production application
        if: github.ref_name == 'prod'
        run: npm run build:production

      - name: Upload validated web artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.ref_name }}-${{ github.sha }}
          path: dist/makhana-x/browser
          if-no-files-found: error
          retention-days: 14

  publish-development-image:
    if: github.event_name != 'pull_request' && github.ref_name == 'dev'
    needs: build
    name: Publish development image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=development
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:dev-latest
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}

  publish-test-image:
    if: github.event_name != 'pull_request' && github.ref_name == 'test'
    needs: build
    name: Publish test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=test
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
            ghcr.io/${{ github.repository }}:test-${{ github.sha }}

  publish-production-image:
    if: github.event_name != 'pull_request' && github.ref_name == 'prod'
    needs: build
    name: Publish production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=production
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository }}:prod-latest
            ghcr.io/${{ github.repository }}:prod-${{ github.sha }}
