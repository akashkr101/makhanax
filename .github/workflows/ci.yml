name: CI

on:
  push:
    branches: [dev, test, prod]
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build development application
        if: github.ref_name == 'dev' || github.event_name == 'pull_request'
        run: npm run build:dev

      - name: Build test application
        if: github.ref_name == 'test'
        run: npm run build:test

      - name: Build production application
        if: github.ref_name == 'prod'
        run: npm run build:production

  publish-development-image:
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: build
    name: Publish development image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=development
          tags: |
            ghcr.io/${{ github.repository }}:dev-latest
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}

  publish-test-image:
    if: github.event_name == 'push' && github.ref_name == 'test'
    needs: build
    name: Publish test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=test
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
            ghcr.io/${{ github.repository }}:test-${{ github.sha }}

  publish-production-image:
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: build
    name: Publish production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=production
          tags: |
            ghcr.io/${{ github.repository }}:prod-latest
            ghcr.io/${{ github.repository }}:prod-${{ github.sha }}