name: CD

on:
  workflow_run:
    workflows: [Build CI]
    types: [completed]
    branches: [dev, test, prod]

permissions:
  actions: read
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    name: Deploy ${{ github.event.workflow_run.head_branch }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'dev' && 'development' || github.event.workflow_run.head_branch == 'test' && 'test' || 'production' }}
      url: https://makhanax-${{ github.event.workflow_run.head_branch }}.web.app
    env:
      FIREBASE_PROJECT_ID: makhanax-${{ github.event.workflow_run.head_branch }}
      FUNCTIONS_DISCOVERY_TIMEOUT: 60
    steps:
      - name: Reject superseded commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq '.commit.sha')"
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo 'A newer commit exists; refusing to deploy an older build.'
            exit 1
          fi

      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Download validated web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
          path: dist/makhana-x/browser
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate Firebase deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets[github.event.workflow_run.head_branch == 'dev' && 'FIREBASE_SERVICE_ACCOUNT_DEVELOPMENT' || github.event.workflow_run.head_branch == 'test' && 'FIREBASE_SERVICE_ACCOUNT_TEST' || 'FIREBASE_SERVICE_ACCOUNT_PRODUCTION'] }}

      - name: Install and build Cloud Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions

      - name: Configure email parameters
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const fields = ['SMTP_HOST', 'SMTP_PORT', 'SMTP_USER', 'SMTP_FROM'];
          for (const field of fields) {
            if (!process.env[field]) throw new Error(`Missing environment variable: ${field}`);
          }
          const contents = fields.map(field => `${field}=${JSON.stringify(process.env[field])}`).join('\n');
          writeFileSync(`functions/.env.${process.env.FIREBASE_PROJECT_ID}`, contents);
          NODE

      - name: Deploy backend and security rules
        run: npx --yes firebase-tools@15.33.0 deploy --only functions,firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy validated frontend
        run: npx --yes firebase-tools@15.33.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive