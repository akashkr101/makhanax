name: Build, Publish, and Deploy

on:
  push:
    branches: [dev, test, prod]
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build development application
        if: github.ref_name == 'dev' || github.event_name == 'pull_request'
        run: npm run build -- --configuration development

      - name: Build test application
        if: github.ref_name == 'test'
        run: npm run build -- --configuration test

      - name: Build production application
        if: github.ref_name == 'prod'
        run: npm run build -- --configuration production

  publish-test-image:
    if: github.event_name == 'push' && github.ref_name == 'test'
    needs: validate
    name: Publish test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=test
          tags: |
            ghcr.io/${{ github.repository }}:test-latest
            ghcr.io/${{ github.repository }}:test-${{ github.sha }}

  deploy-test:
    if: github.event_name == 'push' && github.ref_name == 'test'
    needs: [validate, publish-test-image]
    name: Deploy test site
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://makhanax-01.web.app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build test application
        run: npm run build -- --configuration test

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAKHANAX_01 }}
          channelId: live
          projectId: makhanax-01

  publish-production-image:
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: validate
    name: Publish production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_CONFIGURATION=production
          tags: |
            ghcr.io/${{ github.repository }}:prod-latest
            ghcr.io/${{ github.repository }}:prod-${{ github.sha }}

  deploy-production:
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: [validate, publish-production-image]
    name: Deploy production site
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://makhanax-prod-2026.web.app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build -- --configuration production

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
          channelId: live
          projectId: makhanax-prod-2026